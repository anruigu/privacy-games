apiVersion: batch/v1
kind: Job
metadata:
  name: allie-privacyzero-a2
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    kueue.x-k8s.io/priority-class: q1
    owner: allie
    project: privacyzero
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        kueue.x-k8s.io/podset-required-topology: kubernetes.io/hostname
    spec:
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B300-SXM6-PC
        topology.nebius.com/gpu-cluster-id: computegpucluster-e04x263hvn91b321fq
        workload: fleetai-training-ng-gpu
      tolerations:
        - effect: NoSchedule
          key: workload
          operator: Equal
          value: fleetai-training-ng-gpu
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sfs-shared
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
      containers:
        - name: main
          image: nvcr.io/nvidia/pytorch@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
          command: ["bash", "-lc", "bash /shared/allie/privacy/selfplay/pod_entry.sh 2>&1 | tee -a /shared/allie/privacy/selfplay/run/pod_entry.log"]
          env:
            - { name: HOME, value: /tmp/home }
            - { name: HF_HOME, value: /shared/allie/privacy/selfplay/hf }
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: TOKENIZERS_PARALLELISM, value: "false" }
            - { name: TRITON_CACHE_DIR, value: /tmp/home/triton }
            - { name: TORCHINDUCTOR_CACHE_DIR, value: /tmp/home/inductor }
            - { name: XDG_CACHE_HOME, value: /tmp/home/.cache }
            - { name: VLLM_ALLOW_RUNTIME_LORA_UPDATING, value: "1" }
          resources:
            requests: { cpu: "40", memory: "384Gi", ephemeral-storage: "300Gi", nvidia.com/gpu: "6" }
            limits: { cpu: "40", memory: "384Gi", ephemeral-storage: "300Gi", nvidia.com/gpu: "6" }
          volumeMounts:
            - { name: shared, mountPath: /shared/allie, subPath: allie }
            - { name: shm, mountPath: /dev/shm }
